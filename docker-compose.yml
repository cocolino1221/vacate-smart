# Pornire pe server:  cp .env.example .env  (completați)  apoi  docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vacate
      POSTGRES_USER: vacate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?setati POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacate"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vacate:${POSTGRES_PASSWORD}@db:5432/vacate
      REDIS_URL: redis://redis:6379
      PORT: 4000
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build:
      context: ./frontend
      args: { API_INTERNAL_URL: http://api:4000 }
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - certbot-www:/var/www/certbot:ro
    depends_on: [web, api]

  certbot:
    image: certbot/certbot:v2.11.0
    volumes:
      - ./nginx/certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done'

volumes:
  pgdata:
  certbot-www:
