# Înlocuiți vacatesmart.ro cu domeniul vostru.
server {
  listen 80;
  server_name vacatesmart.ro www.vacatesmart.ro;
  location /.well-known/acme-challenge/ { root /var/www/certbot; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name vacatesmart.ro www.vacatesmart.ro;

  ssl_certificate     /etc/nginx/certs/live/vacatesmart.ro/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/live/vacatesmart.ro/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  client_max_body_size 2m;
  gzip on;
  gzip_types application/json text/css application/javascript;

  # API (inclusiv webhook-ul Stripe) direct la backend
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
